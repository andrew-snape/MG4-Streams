name: Release
# Builds the release APK, signs it with the MG4 platform key (repository secrets) and publishes a
# GitHub release. The in-app updater reads the latest release of this repo.
# Start it with scripts/release.sh (bumps the version, tags vX.Y.Z and pushes the tag), or run
# it by hand from the Actions tab with a tag that matches versionName.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.2). Must match versionName; created on the chosen branch if missing.'
        required: true
      dry_run:
        description: 'Dry run: build, sign and check, keep the APK as a workflow artifact, publish nothing.'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
jobs:
  # scripts/release.sh --local publishes from the Mac and pushes the tag too: don't build twice.
  existing:
    runs-on: ubuntu-26.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: existing
    if: needs.existing.outputs.exists != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Signing certificate the head unit has; anything else would be refused as an update.
      EXPECTED_CERT_SHA256: c8a2e9bccf597c2fb6dc66bee293fc13f2fc47ec77bc6b2b0d52c11f51192ab8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0
      - name: Check an existing tag points at this commit
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $TAG is at $tagged, not at this branch's $(git rev-parse HEAD). Run the workflow from the tag instead."
              exit 1
            fi
          fi
      - name: Check tag matches versionName
        run: |
          version=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from the tag message
        run: |
          git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ] || [ "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" = "" ]; then
            echo "MG4 Streams $VERSION" > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Restore platform key
        env:
          PLATFORM_PK8: ${{ secrets.MG4_PLATFORM_PK8_BASE64 }}
          PLATFORM_CERT: ${{ secrets.MG4_PLATFORM_CERT_BASE64 }}
        run: |
          for name in PLATFORM_PK8 PLATFORM_CERT; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret for $name is not set"; exit 1; fi
          done
          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          echo "$PLATFORM_PK8" | base64 --decode > "$keys/platform.pk8"
          echo "$PLATFORM_CERT" | base64 --decode > "$keys/platform.x509.pem"
          echo "KEYS=$keys" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build the release APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Sign with the platform key and check the certificate
        run: |
          bt="$ANDROID_HOME/build-tools/34.0.0"
          out="dist/MG4Streams-$VERSION-platform.apk"
          mkdir -p dist
          "$bt/apksigner" sign --key "$KEYS/platform.pk8" --cert "$KEYS/platform.x509.pem" \
            --out "$out" app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f dist/*.idsig
          sha=$("$bt/apksigner" verify --print-certs "$out" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
          if [ "$sha" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate is $sha, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          "$bt/aapt2" dump badging "$out" | head -1
          echo "APK=$out" >> "$GITHUB_ENV"
      - name: Remove keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - name: Keep the APK (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: MG4Streams-${{ env.VERSION }}-platform-dry-run
          path: ${{ env.APK }}
      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: MG4 Streams ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: ${{ env.APK }}
          fail_on_unmatched_files: true
